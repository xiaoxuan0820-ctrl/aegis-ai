<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">KISIV AI Trust Principles</title><desc id="desc">Four principles: zero trust, least privilege, human approval, and verifiable actions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9ff"/><stop offset="1" stop-color="#e7efff"/></linearGradient><linearGradient id="a"><stop stop-color="#2869f6"/><stop offset="1" stop-color="#7257ff"/></linearGradient></defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="60" y="70" fill="#10244a" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">Security with boundaries. Trust with evidence.</text><text x="60" y="106" fill="#52698f" font-family="Inter,Arial,sans-serif" font-size="18">KISIV AI · CORE TRUST PRINCIPLES</text>
<g font-family="Inter,Arial,sans-serif"><g fill="#fff" stroke="#d6e2f8" stroke-width="2"><rect x="60" y="150" width="520" height="190" rx="22"/><rect x="620" y="150" width="520" height="190" rx="22"/><rect x="60" y="370" width="520" height="190" rx="22"/><rect x="620" y="370" width="520" height="190" rx="22"/></g>
<g fill="url(#a)"><circle cx="125" cy="215" r="35"/><circle cx="685" cy="215" r="35"/><circle cx="125" cy="435" r="35"/><circle cx="685" cy="435" r="35"/></g>
<g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M111 215 l10 10 19 -22"/><path d="M671 207 h28 v18 h-28z M677 202 v-6 h16 v6"/><path d="M672 435 l9 9 18 -21"/><path d="M673 431 l12 -9 12 9 v14 l-12 8 -12 -8z"/></g>
<g fill="#142c55" font-size="23" font-weight="700"><text x="180" y="207">Zero Trust</text><text x="740" y="207">Least Privilege</text><text x="180" y="427">Human Approval</text><text x="740" y="427">Verifiable Actions</text></g>
<g fill="#5b6f92" font-size="17"><text x="180" y="241">Verify each request; trust nothing by default.</text><text x="740" y="241">Grant only the access needed for the task.</text><text x="180" y="461">Keep people in control of high-impact decisions.</text><text x="740" y="461">Test outcomes, not just execution status.</text></g>
<g fill="#2869f6" font-size="13" font-weight="700" letter-spacing="1.2"><text x="180" y="292">VERIFY</text><text x="740" y="292">LIMIT</text><text x="180" y="512">APPROVE</text><text x="740" y="512">AUDIT</text></g></g>
<text x="60" y="610" fill="#52698f" font-family="Inter,Arial,sans-serif" font-size="16">Dry-run first · Explainable decisions · Privacy by design · Reversible where possible</text>
</svg>