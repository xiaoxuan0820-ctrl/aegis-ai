<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">KISIV AI Security Architecture</title><desc id="desc">A layered security workflow from event sources through KISIV AI policy controls to verified and auditable response.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152e"/><stop offset="1" stop-color="#132c5b"/></linearGradient><linearGradient id="accent"><stop stop-color="#35d4f4"/><stop offset="1" stop-color="#6b5cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/><circle cx="1030" cy="60" r="180" fill="#3c68ff" opacity=".12" filter="url(#glow)"/>
<text x="60" y="65" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">KISIV AI</text><text x="60" y="98" fill="#a9c7ef" font-family="Inter,Arial,sans-serif" font-size="17">SECURITY ARCHITECTURE · CONTROLLED BY DESIGN</text>
<text x="60" y="155" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">01  Signal sources</text>
<g font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle"><g fill="#122c50" stroke="#4779b8"><rect x="60" y="180" width="240" height="76" rx="14"/><rect x="330" y="180" width="240" height="76" rx="14"/><rect x="600" y="180" width="240" height="76" rx="14"/><rect x="870" y="180" width="270" height="76" rx="14"/></g><g fill="#fff"><text x="180" y="225">Devices &amp; accounts</text><text x="450" y="225">Websites &amp; servers</text><text x="720" y="225">AI agents &amp; tools</text><text x="1005" y="225">Logs &amp; user reports</text></g></g>
<path d="M600 258 V294" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><path d="M590 285 L600 298 L610 285" fill="none" stroke="#35d4f4" stroke-width="4"/>
<rect x="60" y="305" width="1080" height="154" rx="20" fill="#102b55" stroke="url(#accent)" stroke-width="2"/>
<text x="90" y="342" fill="#78e6ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">02  KISIV AI CONTROL PLANE</text>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#173967" stroke="#4e8cd2"><rect x="88" y="365" width="235" height="68" rx="12"/><rect x="348" y="365" width="235" height="68" rx="12"/><rect x="608" y="365" width="235" height="68" rx="12"/><rect x="868" y="365" width="242" height="68" rx="12"/></g><g fill="#fff" font-size="18" font-weight="600"><text x="205" y="393">Normalize</text><text x="205" y="416" fill="#b5d0f2" font-size="14">Evidence &amp; context</text><text x="465" y="393">Assess risk</text><text x="465" y="416" fill="#b5d0f2" font-size="14">Rules + AI assistance</text><text x="725" y="393">Policy &amp; approval</text><text x="725" y="416" fill="#b5d0f2" font-size="14">Least privilege</text><text x="989" y="393">Controlled response</text><text x="989" y="416" fill="#b5d0f2" font-size="14">Dry-run by default</text></g></g>
<path d="M600 460 V494" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><path d="M590 485 L600 498 L610 485" fill="none" stroke="#35d4f4" stroke-width="4"/>
<g font-family="Inter,Arial,sans-serif"><rect x="60" y="505" width="510" height="88" rx="16" fill="#102b45" stroke="#32c7df"/><rect x="590" y="505" width="550" height="88" rx="16" fill="#102b45" stroke="#7b70ff"/><text x="88" y="540" fill="#61e4f3" font-size="19" font-weight="700">03  Verify the outcome</text><text x="88" y="568" fill="#d8e7ff" font-size="16">Check whether the risk actually changed</text><text x="620" y="540" fill="#a9a0ff" font-size="19" font-weight="700">04  Keep an audit trail</text><text x="620" y="568" fill="#d8e7ff" font-size="16">Record decisions, approvals and evidence</text></g>
</svg>